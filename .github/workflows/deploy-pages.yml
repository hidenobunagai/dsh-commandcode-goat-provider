name: Deploy GitHub Pages

# Publishes the interactive architecture diagram only. docs/ also carries internal
# notes (model-sync.md, superpowers/); docs/index.html is fully self-contained (every
# image is an inlined data: URI), so the artifact is staged with just the diagram
# files and the markdown never reaches the public site.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage the public artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          rsync -a --exclude='*.md' --exclude='superpowers/' docs/ "$RUNNER_TEMP/pages/"
          find "$RUNNER_TEMP/pages" -type f | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
