name: CI

# The catalog this package ships is rewritten automatically (homepi
# daily-model-watch / docs/model-sync.md), so every push must prove the plugin
# still tests and builds before the local DSH profile consumes it.
#
# `bun run typecheck` is deliberately absent: this checkout carries five
# pre-existing ToolCallId errors in the vendored @deepseek-ai/dsh-llm types,
# so a type gate would be red for reasons unrelated to the change.
#
# The OSV scan runs LAST on purpose. It reads the lockfile, so it turns red on
# any advisory published against a transitive dependency -- including dev-only
# ones -- with no change to this repository at all. When it ran second, a
# single such advisory (source-map-js, 2026-10-09) meant lint, test and build
# never executed for a week: the job failed before reaching them, so a real
# regression would have shipped unnoticed. Security still gates the job; it
# just no longer decides whether the plugin gets tested.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the local toolchain: bun.lock is lockfileVersion 2
          # (written by bun 1.4.x), which 1.3.8 cannot parse -- `--frozen-lockfile`
          # then fails with "Unknown lockfile version" before any test runs.
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Supply chain scan (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --lockfile bun.lock
